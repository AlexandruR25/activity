<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Activity Party</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        
        <div id="setup-screen" class="screen active">
            <div class="logo-area">
                <h1>ACTIVITY <span class="accent">PARTY</span></h1>
                <p>Editia Digitală Premium</p>
            </div>
            
            <div class="setup-box">
                <h3>1. Configurare Joc</h3>
                <label>Puncte pentru victorie:</label>
                <input type="number" id="win-score-input" value="30" min="10" max="100">

                <h3>2. Adaugă Echipe</h3>
                <div class="input-group">
                    <input type="text" id="team-input" placeholder="Nume Echipă (ex: Leii)">
                    <button id="add-team-btn" class="icon-btn">➕</button>
                </div>
                <ul id="team-list"></ul>
            </div>

            <button id="start-game-btn" class="main-btn" disabled>START PARTY 🚀</button>
        </div>

        <div id="game-screen" class="screen">
            <div class="top-bar">
                <div class="turn-info">
                    <span class="label">Rândul echipei:</span>
                    <h2 id="current-team-name">Echipa 1</h2>
                </div>
                <div class="timer-box">
                    <span id="timer">60</span>s
                </div>
            </div>

            <div class="board-container">
                <div id="board"></div>
            </div>

            <div class="action-area">
                
                <div id="selection-phase">
                    <p class="instruction">Alegeți o provocare:</p>
                    <div class="cards-grid" id="cards-grid">
                        </div>
                </div>

                <div id="active-card-phase" class="hidden">
                    <div class="active-card">
                        <div class="card-header">
                            <span id="ac-icon">✏️</span>
                            <span id="ac-type">DESEN</span>
                            <span id="ac-points">3</span>
                        </div>
                        <h1 id="ac-word">CUVÂNT</h1>
                    </div>
                    
                    <div class="decision-buttons">
                        <button id="fail-btn" class="btn fail">❌ Eșec</button>
                        <button id="success-btn" class="btn success">✅ Succes</button>
                    </div>
                </div>

            </div>
            
            <div id="mini-scoreboard"></div>
        </div>

        <div id="win-screen" class="screen">
            <div class="confetti">🎉</div>
            <h1>AVEM UN CÂȘTIGĂTOR!</h1>
            <h2 id="winner-name" class="winner-text">Echipa X</h2>
            <button onclick="location.reload()" class="main-btn reload">Joacă din nou 🔁</button>
        </div>

    </div>

    <audio id="alarm-sound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>
    <script src="script.js"></script>
</body>
</html>
