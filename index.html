<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity Party Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>

/* ====== RESET ====== */
*{box-sizing:border-box;margin:0;padding:0}

/* ====== COLORS ====== */
:root {
--bg-dark:#121212;
--bg-panel:#1e1e2e;
--accent:#ff0055;
--text-main:#ffffff;
--success:#00b894;
--skip:#636e72;
--c-desen:#ffeaa7;
--c-mima:#74b9ff;
--c-vorba:#55efc4;
}

/* ====== BODY ====== */
body{
font-family:'Poppins',sans-serif;
background:#0a0a1a;
color:#fff;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

/* ====== APP ====== */
.app-container{
background:var(--bg-panel);
width:100%;
max-width:1200px;
min-height:90vh;
border-radius:20px;
display:flex;
flex-direction:column;
overflow:hidden;
box-shadow:0 0 40px rgba(0,0,0,.4);
}

/* ====== SCREENS ====== */
.screen{
flex:1;
display:none;
}
.screen.active{
display:flex;
}

/* ====== SETUP ====== */
.setup-wrapper{
width:100%;
max-width:480px;
margin:auto;
padding:20px;
}
.logo{
font-size:2.6rem;
font-weight:800;
text-align:center;
margin-bottom:20px;
}
.accent{color:var(--accent);}
.setup-card{
background:rgba(255,255,255,0.05);
padding:18px;
border-radius:14px;
margin-bottom:12px;
}
.checkbox-group{display:flex;gap:8px;margin-top:10px;}
.chk-btn{flex:1;text-align:center;padding:10px;border-radius:10px;background:#2a2a3a;font-size:.8rem;font-weight:600;cursor:pointer}
.chk-btn.checked{background:var(--accent);color:#fff}
.chk-btn input{display:none}
.btn-start{
width:100%;padding:16px;
background:linear-gradient(135deg,var(--accent),#ff7675);
border-radius:12px;border:none;color:#fff;
font-size:1.3rem;font-weight:800;cursor:pointer;
margin-top:16px;
}
.btn-start:disabled{opacity:.4}
.btn-add{
background:var(--success);border:none;color:#fff;
width:45px;border-radius:10px;font-size:1.6rem;
}
.team-list{list-style:none;margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:6px}

/* ====== GAME LAYOUT DESKTOP ====== */
@media (min-width:900px){

#game-screen{flex-direction:row}

.sidebar{
width:320px;
flex-shrink:0;
display:flex!important;
flex-direction:column;
background:rgba(0,0,0,.25);
border-right:1px solid rgba(255,255,255,.1);
padding:18px;
overflow-y:auto;
}

.main-game-area{
flex:1;
padding:25px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
overflow-y:auto;
}

.mobile-top-bar,
.board-wrapper-mobile{
display:none!important;
}
}

/* ====== GAME LAYOUT MOBILE ====== */
@media (max-width:899px){

.app-container{
border-radius:0;
min-height:100vh;
}

.sidebar{display:none!important;}

.mobile-top-bar{
display:flex!important;
justify-content:space-between;
align-items:center;
padding:10px 15px;
background:rgba(0,0,0,.3);
border-radius:14px;
margin:10px;
}

.main-game-area{
padding:10px;
flex:1;
overflow-y:auto;
}

.board-wrapper-mobile{
display:block!important;
margin:10px;
}

.board-container{max-height:150px}
}

/* ====== COMMON UI ====== */
.timer-circle{
width:52px;height:52px;
background:var(--accent);
border-radius:50%;
display:flex;align-items:center;justify-content:center;
font-weight:900;font-size:1.3rem;
}
.board-container{
background:rgba(255,255,255,.05);
padding:10px;border-radius:14px;
border:1px solid rgba(255,255,255,.08);
overflow-y:auto;
}

/* BOARD */
#board{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.tile{
width:30px;height:30px;
background:#2d3436;
border-radius:6px;
display:flex;align-items:center;justify-content:center;
font-size:.75rem;color:#777;
position:relative;
}
.tile.finish{background:gold;color:#000}
.pawn{
width:10px;height:10px;border-radius:50%;
border:1.5px solid #fff;
position:absolute;
}

/* MAIN CARDS */
.info-card,.word-card{
background:#fff;color:#2d3436;
border-radius:16px;
max-width:480px;
width:100%;
box-shadow:0 10px 20px rgba(0,0,0,.4);
padding:20px;
}
.word-card{
min-height:210px;
display:flex;flex-direction:column;justify-content:center;
position:relative;
}
.word-text{font-size:2.1rem;font-weight:900;text-align:center}

/* WINNER */
.winner-name{font-size:3rem;color:gold}

/* Buttons */
.controls{max-width:480px;width:100%;display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:14px}
.btn{border:none;border-radius:12px;font-weight:900;color:#fff;font-size:1.2rem}
.btn-skip{background:#636e72}
.btn-ok{background:#00b894}

</style>
</head>

<body>

<div class="app-container">

<!-- ========= SETUP ========= -->
<div id="setup-screen" class="screen active">
<div class="setup-wrapper">

<div class="logo">ACTIVITY<br><span class="accent">PARTY</span></div>

<div class="setup-card">
<p><b>Puncte victorie</b></p>
<input id="win-score" type="number" value="30" style="padding:8px;border-radius:10px;border:none;width:80px;text-align:center">

<p style="margin-top:10px">Categorii:</p>
<div class="checkbox-group">
<label class="chk-btn checked"><input type="checkbox" value="DESEN" checked>✏️ DESEN</label>
<label class="chk-btn checked"><input type="checkbox" value="MIMA" checked>🙊 MIMĂ</label>
<label class="chk-btn checked"><input type="checkbox" value="VORBA" checked>🗣️ VORBĂ</label>
</div>
</div>

<div class="setup-card">
<p><b>Echipe</b></p>
<div style="display:flex;gap:8px">
<input id="team-input" type="text" placeholder="Nume echipă…" style="flex:1;padding:10px;border-radius:10px;border:none;background:#2a2a3a;color:#fff">
<button class="btn-add" onclick="addTeam()">+</button>
</div>
<ul id="team-list" class="team-list"></ul>
</div>

<button id="btn-start" class="btn-start" onclick="startGame()" disabled>START</button>

</div>
</div>

<!-- ========= GAME ========= -->
<div id="game-screen" class="screen">

<div class="sidebar">
<div style="display:flex;justify-content:space-between">
<div>
<small>Rândul echipei</small>
<div class="active-team-name-display" style="font-weight:800"></div>
</div>
<div class="timer-circle timer-display">60</div>
</div>

<div class="board-container" style="margin-top:12px">
<div id="board-pc"></div>
</div>

<p style="text-align:center;margin-top:10px">
Categorie: <b class="global-cat-display"></b>
</p>
</div>

<div class="mobile-top-bar">
<div>
<small>Rândul echipei</small>
<div class="active-team-name-display" style="font-weight:800"></div>
</div>
<div class="timer-circle timer-display">60</div>
</div>

<div class="main-game-area">

<div id="phase-info">
<div class="info-card">
<p>URMEAZĂ</p>
<h2 id="next-cat-badge">DESEN</h2>
<button class="btn-ok" onclick="startTimerLogic()" style="margin-top:10px;width:100%">START</button>
</div>
</div>

<div id="phase-play" style="display:none">
<div class="word-card">
<div id="word-text">Cuvânt</div>
<div style="position:absolute;top:12px;right:12px" id="card-points">3p</div>
</div>

<div class="controls">
<button class="btn btn-skip" onclick="nextWord(false)">PAS</button>
<button class="btn btn-ok" onclick="nextWord(true)">CORECT</button>
</div>
</div>

</div>

<div class="board-wrapper-mobile">
<div class="board-container">
<div id="board-mobile"></div>
</div>
</div>

</div>

<!-- ========= WIN ========= -->
<div id="win-screen" class="screen">
<div style="margin:auto;text-align:center">
<h1>🏆 CÂȘTIGĂTORI 🏆</h1>
<div id="winner-name" class="winner-name"></div>
<button class="btn-start" onclick="location.reload()">RESTART</button>
</div>
</div>

</div>

<audio id="sound-alarm" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script>
    // --- DATABASE ---
    const DB = {
        DESEN: [{w:"Umbrelă",p:3},{w:"Pizza",p:3},{w:"Fantoma",p:4},{w:"Avion",p:3},{w:"Soare",p:2},{w:"Floare",p:2},{w:"Câine",p:3},{w:"Casă",p:2},{w:"Ochelari",p:3},{w:"Bec",p:3},{w:"Fluture",p:4},{w:"Tort",p:3},{w:"Girafă",p:4},{w:"Vulcan",p:4},{w:"Piramidă",p:5},{w:"Elicopter",p:5},{w:"Cactus",p:4},{w:"Păianjen",p:3},{w:"Dinozaur",p:5},{w:"Castel",p:4},{w:"Bicicletă",p:4},{w:"Foarfece",p:3},{w:"Cheie",p:2},{w:"Măr",p:2},{w:"Barcă",p:3},{w:"Șarpe",p:3},{w:"Ciocan",p:3},{w:"Tractor",p:5},{w:"Laptop",p:4},{w:"Telefon",p:3},{w:"Semafor",p:4},{w:"Iepure",p:3},{w:"Pisică",p:2},{w:"Clovn",p:5},{w:"Balon",p:2},{w:"Pod",p:4},{w:"Scarabeu",p:5},{w:"Vampir",p:4},{w:"Mumie",p:4},{w:"Sirena",p:5}],
        MIMA: [{w:"Fotbalist",p:3},{w:"Maimuță",p:3},{w:"Chitarist",p:3},{w:"Balet",p:4},{w:"Somnuros",p:2},{w:"Pescuit",p:3},{w:"Dirijor",p:4},{w:"Boxer",p:3},{w:"Bucătar",p:3},{w:"Pinguin",p:4},{w:"Robot",p:3},{w:"Zombi",p:3},{w:"DJ",p:4},{w:"Polițist",p:3},{w:"Doctor",p:3},{w:"Frizer",p:3},{w:"Scafandru",p:5},{w:"Pompier",p:4},{w:"Vânător",p:4},{w:"Pictor",p:3},{w:"Kangur",p:4},{w:"Broască",p:3},{w:"Găină",p:3},{w:"Elefant",p:4},{w:"Șofer",p:2},{w:"Pilot",p:4},{w:"Tenismen",p:3},{w:"Schior",p:4},{w:"Pianist",p:4},{w:"Violonist",p:4},{w:"Îndrăgostit",p:3},{w:"Supărat",p:2},{w:"Râs",p:2},{w:"Plâns",p:2},{w:"Strănut",p:2},{w:"Fotograf",p:3},{w:"Model",p:3},{w:"Rege",p:3},{w:"Cântăreț",p:3}],
        VORBA: [{w:"Vacanta",p:3},{w:"Calculator",p:3},{w:"Scoala",p:2},{w:"Telefon",p:2},{w:"Internet",p:3},{w:"Prietenie",p:4},{w:"Libertate",p:5},{w:"Muzică",p:3},{w:"Weekend",p:2},{w:"Cinema",p:3},{w:"Facebook",p:3},{w:"Iarnă",p:2},{w:"Nuntă",p:3},{w:"Zi de naștere",p:3},{w:"Cadou",p:2},{w:"Examen",p:3},{w:"Bani",p:2},{w:"Dragoste",p:4},{w:"Politică",p:4},{w:"Religie",p:4},{w:"Spital",p:3},{w:"Restaurant",p:3},{w:"Hotel",p:3},{w:"Aeroport",p:3},{w:"Gara",p:3},{w:"Autobuz",p:2},{w:"Metrou",p:3},{w:"Capitală",p:4},{w:"România",p:3},{w:"Europa",p:4},{w:"Planeta",p:4},{w:"Univers",p:5},{w:"Extraterestru",p:4},{w:"Viitor",p:5},{w:"Trecut",p:5},{w:"Istorie",p:4},{w:"Matematică",p:4},{w:"Fizică",p:5},{w:"Chimie",p:5}]
    };
    const TEAM_COLORS = ['#ff595e', '#1982c4', '#8ac926', '#ffca3a', '#9b59b6'];
    
    // --- STATE ---
    let teams = [];
    let activeCategories = [];
    let targetScore = 30;
    let currentTeamIdx = 0;
    let currentGlobalCategory = null;
    let teamsPlayedThisRound = 0;
    let roundWords = [];
    let currentWordIdx = 0;
    let roundScore = 0;
    let timerInterval = null;
    let timeLeft = 60;

    // --- UI HELPERS ---
    function toggleChk(el) {
        const input = el.querySelector('input');
        input.checked = !input.checked;
        el.classList.toggle('checked', input.checked);
    }
    function updateDisplays(className, text) {
        document.querySelectorAll('.' + className).forEach(el => el.textContent = text);
    }
    function updateColors(className, color) {
         document.querySelectorAll('.' + className).forEach(el => el.style.color = color);
    }

    // --- SETUP ---
    function addTeam() {
        const input = document.getElementById('team-input');
        const name = input.value.trim();
        if(!name) return;
        if(teams.length >= 5) { alert("Maxim 5 echipe!"); return; }
        const color = TEAM_COLORS[teams.length];
        teams.push({ name, score: 0, color });
        const li = document.createElement('li');
        li.innerHTML = `<span style="width:10px; height:10px; border-radius:50%; background:${color}; margin-right:5px;"></span> ${name}`;
        document.getElementById('team-list').appendChild(li);
        input.value = '';
        document.getElementById('btn-start').disabled = false;
    }

    function startGame() {
        targetScore = parseInt(document.getElementById('win-score').value) || 30;
        activeCategories = Array.from(document.querySelectorAll('.checkbox-group input:checked')).map(c => c.value);
        if(activeCategories.length === 0) { alert("Selectează o categorie!"); return; }

        // Generam ambele table (PC si Mobil)
        ['board-pc', 'board-mobile'].forEach(id => {
            const board = document.getElementById(id);
            board.innerHTML = '';
            for(let i=0; i<=targetScore; i++) {
                const t = document.createElement('div');
                t.className = 'tile' + (i===targetScore ? ' finish' : '');
                t.textContent = i;
                t.id = `${id}-tile-${i}`;
                board.appendChild(t);
            }
        });

        updatePawns();
        pickGlobalCategory();
        document.getElementById('setup-screen').classList.remove('active');
        document.getElementById('game-screen').classList.add('active');
        prepareTurnUI();
    }

    // --- GAME LOGIC ---
    function pickGlobalCategory() {
        currentGlobalCategory = activeCategories[Math.floor(Math.random() * activeCategories.length)];
        teamsPlayedThisRound = 0;
        updateDisplays('global-cat-display', getCatLabel(currentGlobalCategory));
    }
    function getCatLabel(cat) { return cat === 'DESEN' ? "DESEN ✏️" : (cat === 'MIMA' ? "MIMĂ 🙊" : "VORBEȘTE 🗣️"); }
    function getCatClass(cat) { return cat === 'DESEN' ? "bg-desen" : (cat === 'MIMA' ? "bg-mima" : "bg-vorba"); }

    function prepareTurnUI() {
        const team = teams[currentTeamIdx];
        updateDisplays('active-team-name-display', team.name);
        updateColors('active-team-name-display', team.color);
        
        document.getElementById('phase-info').classList.remove('hidden');
        document.getElementById('phase-play').classList.add('hidden');

        const badge = document.getElementById('next-cat-badge');
        badge.className = `cat-badge ${getCatClass(currentGlobalCategory)}`;
        badge.textContent = getCatLabel(currentGlobalCategory);

        roundWords = DB[currentGlobalCategory].sort(() => 0.5 - Math.random()).slice(0, 6);
        currentWordIdx = 0; roundScore = 0;
        updateDisplays('timer-display', "60");
        document.querySelectorAll('.timer-display').forEach(el => el.style.background = "var(--accent)");
    }

    function startTimerLogic() {
        document.getElementById('phase-info').classList.add('hidden');
        document.getElementById('phase-play').classList.remove('hidden');
        showWord();
        timeLeft = 60;
        if(timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            updateDisplays('timer-display', timeLeft);
            if(timeLeft <= 10) document.querySelectorAll('.timer-display').forEach(el => el.style.background = "#d63031");
            if(timeLeft <= 0) endTurn();
        }, 1000);
    }

    function showWord() {
        if(currentWordIdx >= roundWords.length) { endTurn(); return; }
        const w = roundWords[currentWordIdx];
        document.getElementById('word-idx').textContent = (currentWordIdx + 1);
        document.getElementById('word-text').textContent = w.w;
        document.getElementById('card-points').textContent = w.p + "p";
        document.getElementById('card-cat-label').textContent = currentGlobalCategory;
        const cardBg = document.getElementById('game-card-bg');
        cardBg.className = 'word-card'; // reset
        if(currentGlobalCategory === 'DESEN') cardBg.style.borderTop = "10px solid var(--c-desen)";
        else if(currentGlobalCategory === 'MIMA') cardBg.style.borderTop = "10px solid var(--c-mima)";
        else cardBg.style.borderTop = "10px solid var(--c-vorba)";
    }

    function nextWord(isCorrect) {
        if(isCorrect) roundScore += roundWords[currentWordIdx].p;
        currentWordIdx++; showWord();
    }

    function endTurn() {
        clearInterval(timerInterval);
        document.getElementById('sound-alarm').play();
        teams[currentTeamIdx].score = Math.min(teams[currentTeamIdx].score + roundScore, targetScore);
        if(teams[currentTeamIdx].score >= targetScore) { updatePawns(); showWin(); return; }
        updatePawns();
        teamsPlayedThisRound++; currentTeamIdx++;
        if(currentTeamIdx >= teams.length) currentTeamIdx = 0;
        if(teamsPlayedThisRound >= teams.length) pickGlobalCategory();
        setTimeout(prepareTurnUI, 1500);
    }

    function updatePawns() {
        document.querySelectorAll('.pawn').forEach(p => p.remove());
        teams.forEach((t, i) => {
            const pos = Math.min(t.score, targetScore);
            ['board-pc', 'board-mobile'].forEach(boardId => {
                 const tile = document.getElementById(`${boardId}-tile-${pos}`);
                 if(tile) {
                    const p = document.createElement('div');
                    p.className = 'pawn'; p.style.background = t.color;
                    p.style.left = (4 + i*6) + 'px'; p.style.bottom = (4 + (i%2)*6) + 'px';
                    tile.appendChild(p);
                    if(i === currentTeamIdx) tile.scrollIntoView({block: "center", behavior: "smooth"});
                 }
            });
        });
    }

    function showWin() {
        document.getElementById('game-screen').classList.remove('active');
        document.getElementById('win-screen').classList.add('active');
        document.getElementById('winner-name').textContent = teams[currentTeamIdx].name;
    }
</script>
</body>
</html>
